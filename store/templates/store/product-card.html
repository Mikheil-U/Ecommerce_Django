{% for product in products %}
<article class="product-card">
    <a class="product-image" href="{{ product.get_absolute_url }}">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.title }}" loading="lazy">{% else %}<span class="image-placeholder">MyShop.</span>{% endif %}<span class="product-arrow" aria-hidden="true">↗</span></a>
    <div class="product-meta"><p class="product-brand">{{ product.brand }}</p><div class="product-heading"><h3><a href="{{ product.get_absolute_url }}">{{ product.title|capfirst }}</a></h3><span class="product-price">${{ product.price }}</span></div></div>
</article>
{% empty %}<div class="empty-collection"><h3>A little room for something new.</h3><p>There are no products in this collection yet.</p><a href="{% url 'store' %}" class="btn btn-outline-primary">Browse all products</a></div>{% endfor %}
